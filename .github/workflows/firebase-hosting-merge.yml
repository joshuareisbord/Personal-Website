name: Firebase production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      # Resolve main after acquiring the production lock, not the triggering SHA.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - name: Test Firestore and Storage rules in isolated demo projects
        run: npm run test:rules

      - name: Check production Firebase configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          for firebase_variable in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_STORAGE_BUCKET; do
            if [[ ! "${!firebase_variable}" =~ [^[:space:]] ]]; then
              echo "::error::Set repository variable $firebase_variable before deploying production. See README.md."
              exit 1
            fi
          done
          if [[ "$VITE_FIREBASE_PROJECT_ID" != 'personal-website-f17c6' ]]; then
            echo '::error::VITE_FIREBASE_PROJECT_ID must be personal-website-f17c6 for this Hosting deployment.'
            exit 1
          fi

      - name: Validate and build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run verify

      - name: Confirm built revision is still main
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo '::error::Remote main advanced before deployment. Rerun after the latest production run finishes.'
            exit 1
          fi

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_F17C6 }}
          channelId: live
          projectId: personal-website-f17c6
