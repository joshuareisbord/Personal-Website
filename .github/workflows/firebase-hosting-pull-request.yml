name: Verify and preview pull request

on: pull_request

permissions:
  contents: read

# A PR preview must not connect its editor to the production database.
env:
  VITE_FIREBASE_API_KEY: ''
  VITE_FIREBASE_AUTH_DOMAIN: ''
  VITE_FIREBASE_PROJECT_ID: ''
  VITE_FIREBASE_APP_ID: ''
  VITE_USE_FIREBASE_EMULATORS: 'false'

concurrency:
  group: firebase-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules
      - run: npm run verify

  preview:
    needs: verify
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_F17C6 }}
          projectId: personal-website-f17c6
          expires: 7d
